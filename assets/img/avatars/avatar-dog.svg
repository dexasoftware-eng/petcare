<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="dogBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4e0"/>
      <stop offset="100%" stop-color="#ffe2b3"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="54" fill="url(#dogBg)" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Ears -->
  <path d="M 28 35 C 15 45, 12 70, 24 78 C 30 82, 36 72, 34 60 Z" fill="#b45309" filter="url(#shadow)"/>
  <path d="M 92 35 C 105 45, 108 70, 96 78 C 90 82, 84 72, 86 60 Z" fill="#b45309" filter="url(#shadow)"/>
  
  <!-- Head -->
  <ellipse cx="60" cy="58" rx="34" ry="30" fill="#f59e0b"/>
  
  <!-- Face Patch / Forehead -->
  <path d="M 52 32 C 55 45, 60 48, 60 52 C 60 48, 65 45, 68 32 C 64 30, 56 30, 52 32 Z" fill="#fef3c7"/>
  
  <!-- Muzzle -->
  <ellipse cx="60" cy="68" rx="18" ry="14" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Nose -->
  <path d="M 54 62 C 54 60, 66 60, 66 62 C 66 67, 61 70, 60 70 C 59 70, 54 67, 54 62 Z" fill="#1e293b"/>
  
  <!-- Mouth & Tongue -->
  <path d="M 60 70 L 60 75 M 54 75 Q 60 80 66 75" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 57 77 C 57 84, 63 84, 63 77 Z" fill="#ef4444"/>
  
  <!-- Eyes -->
  <circle cx="45" cy="52" r="5" fill="#1e293b"/>
  <circle cx="43.5" cy="50.5" r="1.8" fill="#ffffff"/>
  <circle cx="75" cy="52" r="5" fill="#1e293b"/>
  <circle cx="73.5" cy="50.5" r="1.8" fill="#ffffff"/>
  
  <!-- Cheeks Blush -->
  <circle cx="36" cy="64" r="5" fill="#f87171" opacity="0.4"/>
  <circle cx="84" cy="64" r="5" fill="#f87171" opacity="0.4"/>
  
  <!-- Red Collar with Gold Tag -->
  <path d="M 38 84 Q 60 94 82 84 Q 60 98 38 84 Z" fill="#fa441d"/>
  <circle cx="60" cy="94" r="5" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
</svg>
