<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="rabBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <filter id="rabShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="54" fill="url(#rabBg)" stroke="#60a5fa" stroke-width="2"/>
  
  <!-- Long Ears -->
  <ellipse cx="44" cy="28" rx="8" ry="24" fill="#f8fafc" transform="rotate(-10, 44, 28)" filter="url(#rabShadow)"/>
  <ellipse cx="44" cy="28" rx="4.5" ry="18" fill="#f472b6" transform="rotate(-10, 44, 28)"/>
  
  <ellipse cx="76" cy="28" rx="8" ry="24" fill="#f8fafc" transform="rotate(10, 76, 28)" filter="url(#rabShadow)"/>
  <ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#f472b6" transform="rotate(10, 76, 28)"/>
  
  <!-- Head -->
  <ellipse cx="60" cy="66" rx="32" ry="26" fill="#f8fafc" filter="url(#rabShadow)"/>
  
  <!-- Cheeks Muzzle -->
  <ellipse cx="54" cy="72" rx="10" ry="8" fill="#ffffff"/>
  <ellipse cx="66" cy="72" rx="10" ry="8" fill="#ffffff"/>
  
  <!-- Nose -->
  <polygon points="57,67 63,67 60,71" fill="#f43f5e"/>
  
  <!-- Bunny Buck Teeth & Mouth -->
  <path d="M 60 71 L 60 74 M 55 74 Q 60 77 65 74" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <rect x="58" y="74" width="4" height="4" rx="1" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Big Friendly Eyes -->
  <ellipse cx="46" cy="58" rx="4.5" ry="5.5" fill="#3b82f6"/>
  <circle cx="46" cy="58" r="4" fill="#0f172a"/>
  <circle cx="44.5" cy="56.5" r="1.6" fill="#ffffff"/>
  
  <ellipse cx="74" cy="58" rx="4.5" ry="5.5" fill="#3b82f6"/>
  <circle cx="74" cy="58" r="4" fill="#0f172a"/>
  <circle cx="72.5" cy="56.5" r="1.6" fill="#ffffff"/>
  
  <!-- Blush -->
  <circle cx="36" cy="68" r="5.5" fill="#f472b6" opacity="0.5"/>
  <circle cx="84" cy="68" r="5.5" fill="#f472b6" opacity="0.5"/>
</svg>
