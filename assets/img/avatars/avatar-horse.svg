<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="horseBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </radialGradient>
    <filter id="horseShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="54" fill="url(#horseBg)" stroke="#eab308" stroke-width="2"/>
  
  <!-- Mane Hair -->
  <path d="M 40 22 C 30 35, 32 60, 24 75 C 34 70, 38 55, 42 42 Z" fill="#451a03" filter="url(#horseShadow)"/>
  <path d="M 60 14 C 55 24, 52 35, 48 42 C 55 35, 62 25, 60 14 Z" fill="#451a03"/>
  <path d="M 72 16 C 68 25, 65 35, 62 42 C 68 35, 75 25, 72 16 Z" fill="#451a03"/>
  
  <!-- Ears -->
  <polygon points="46,36 40,16 54,26" fill="#92400e" filter="url(#horseShadow)"/>
  <polygon points="46,34 42,20 52,28" fill="#fbcfe8"/>
  <polygon points="74,36 80,16 66,26" fill="#92400e" filter="url(#horseShadow)"/>
  <polygon points="74,34 78,20 68,28" fill="#fbcfe8"/>
  
  <!-- Horse Head -->
  <path d="M 44 38 Q 60 30 76 38 Q 82 55 74 72 Q 70 88 60 90 Q 50 88 46 72 Q 38 55 44 38 Z" fill="#b45309" filter="url(#horseShadow)"/>
  
  <!-- White Blaze Mark on Forehead -->
  <path d="M 57 36 Q 60 32 63 36 L 62 65 Q 60 68 58 65 Z" fill="#ffffff"/>
  
  <!-- Muzzle -->
  <ellipse cx="60" cy="80" rx="14" ry="10" fill="#fed7aa"/>
  
  <!-- Nostrils -->
  <circle cx="54" cy="79" r="2.5" fill="#451a03"/>
  <circle cx="66" cy="79" r="2.5" fill="#451a03"/>
  <path d="M 56 85 Q 60 87 64 85" stroke="#451a03" stroke-width="1.5" fill="none"/>
  
  <!-- Big Warm Eyes -->
  <ellipse cx="46" cy="48" rx="4.5" ry="5.5" fill="#0f172a"/>
  <circle cx="44.5" cy="46.5" r="1.8" fill="#ffffff"/>
  <ellipse cx="74" cy="48" rx="4.5" ry="5.5" fill="#0f172a"/>
  <circle cx="72.5" cy="46.5" r="1.8" fill="#ffffff"/>
  
  <!-- Cheeks Blush -->
  <circle cx="38" cy="60" r="4.5" fill="#f87171" opacity="0.4"/>
  <circle cx="82" cy="60" r="4.5" fill="#f87171" opacity="0.4"/>
</svg>
