<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="hamBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </radialGradient>
    <filter id="hamShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="54" fill="url(#hamBg)" stroke="#f97316" stroke-width="2"/>
  
  <!-- Tiny Round Ears -->
  <circle cx="34" cy="34" r="10" fill="#ea580c" filter="url(#hamShadow)"/>
  <circle cx="34" cy="34" r="6" fill="#fed7aa"/>
  
  <circle cx="86" cy="34" r="10" fill="#ea580c" filter="url(#hamShadow)"/>
  <circle cx="86" cy="34" r="6" fill="#fed7aa"/>
  
  <!-- Big Fluffy Head & Cheeks -->
  <ellipse cx="60" cy="64" rx="36" ry="30" fill="#f97316" filter="url(#hamShadow)"/>
  
  <!-- White Chubby Cheeks & Belly -->
  <ellipse cx="44" cy="70" rx="16" ry="14" fill="#ffffff"/>
  <ellipse cx="76" cy="70" rx="16" ry="14" fill="#ffffff"/>
  <ellipse cx="60" cy="76" rx="18" ry="12" fill="#ffffff"/>
  
  <!-- Tiny Pink Nose -->
  <circle cx="60" cy="64" r="3.5" fill="#f43f5e"/>
  
  <!-- Hamster Mouth & Tooth -->
  <path d="M 60 67.5 L 60 71 M 56 71 Q 60 74 64 71" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <rect x="58.5" y="71" width="3" height="3" rx="0.5" fill="#ffffff" stroke="#1e293b" stroke-width="0.8"/>
  
  <!-- Sparkly Hamster Eyes -->
  <circle cx="44" cy="54" r="5" fill="#0f172a"/>
  <circle cx="42.5" cy="52.5" r="2" fill="#ffffff"/>
  
  <circle cx="76" cy="54" r="5" fill="#0f172a"/>
  <circle cx="74.5" cy="52.5" r="2" fill="#ffffff"/>
  
  <!-- Big Rosy Blush -->
  <circle cx="32" cy="68" r="6" fill="#fb7185" opacity="0.6"/>
  <circle cx="88" cy="68" r="6" fill="#fb7185" opacity="0.6"/>
  
  <!-- Tiny Sunflower Seed in Paws -->
  <ellipse cx="60" cy="85" rx="4" ry="7" fill="#78350f" transform="rotate(15, 60, 85)"/>
  <circle cx="52" cy="86" r="4" fill="#fed7aa"/>
  <circle cx="68" cy="86" r="4" fill="#fed7aa"/>
</svg>
