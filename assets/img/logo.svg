<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54" fill="none">
  <!-- Shield and Paw Emblem -->
  <g transform="translate(4, 2)">
    <!-- Outer Shield with Rounded Corners -->
    <path d="M25 1 C38 1, 48 6, 48 18 C48 34, 34 44, 25 49 C16 44, 2 34, 2 18 C2 6, 12 1, 25 1 Z" fill="#fa441d" />
    <path d="M25 4 C36 4, 44 8, 44 19 C44 32, 32 41, 25 45 C18 41, 6 32, 6 19 C6 8, 14 4, 25 4 Z" fill="#fff8e5" opacity="0.18" />
    
    <!-- Central Paw Print in Shield -->
    <!-- Main Pad -->
    <path d="M25 24 C20 24, 16 28, 17 33 C18 37, 21 40, 25 40 C29 40, 32 37, 33 33 C34 28, 30 24, 25 24 Z" fill="#ffffff" />
    <!-- Toe 1 -->
    <circle cx="16" cy="20" r="3.2" fill="#fedc4f" />
    <!-- Toe 2 -->
    <circle cx="22" cy="15" r="3.4" fill="#ffffff" />
    <!-- Toe 3 -->
    <circle cx="28" cy="15" r="3.4" fill="#ffffff" />
    <!-- Toe 4 -->
    <circle cx="34" cy="20" r="3.2" fill="#fedc4f" />
  </g>

  <!-- Brand Typography -->
  <!-- "Pet" in Bold Charcoal -->
  <text x="58" y="34" font-family="'Anybody', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#1e1e1e" letter-spacing="-0.5">Pet</text>
  <!-- "guard" in Vibrant Accent Coral -->
  <text x="108" y="34" font-family="'Anybody', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#fa441d" letter-spacing="-0.5">guard</text>
  <!-- Small Paw Accent above Guard -->
  <circle cx="192" cy="14" r="1.8" fill="#fedc4f" />
  <circle cx="196" cy="12" r="1.5" fill="#fa441d" />
  <circle cx="199" cy="15" r="1.4" fill="#fedc4f" />
  <ellipse cx="195" cy="18" rx="2.5" ry="2" fill="#fa441d" />

  <!-- Subtitle Tagline -->
  <text x="59" y="47" font-family="'Anybody', sans-serif" font-weight="700" font-size="8.5" fill="#888888" letter-spacing="2.8">PET CARE &amp; CLINIC</text>
</svg>
